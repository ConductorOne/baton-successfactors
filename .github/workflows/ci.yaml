name: ci
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_CID: ${{ secrets.SF_SAML_API_KEY }}
      BATON_COMPANY_ID: ${{ secrets.SF_COMPANY_ID }}
      BATON_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
      BATON_ISSUER_URL: ${{ secrets.SF_ISSUER_URL }}
      BATON_SAML_API_KEY: ${{ secrets.SF_SAML_API_KEY }}
      BATON_SUBJECT_NAME_ID: ${{ secrets.SF_SUBJECT_NAME_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-successfactors
        run: go build ./cmd/baton-successfactors
      - name: Write key files
        # The connector reads --public-key and --private-key from file paths.
        # The paths are exported with GITHUB_ENV, because the runner context
        # is not available in the job-level env block.
        env:
          SF_PUBLIC_KEY: ${{ secrets.SF_PUBLIC_KEY }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SF_PUBLIC_KEY" > "$RUNNER_TEMP/sf-public-key.pem"
          printf '%s' "$SF_PRIVATE_KEY" > "$RUNNER_TEMP/sf-private-key.pem"
          echo "BATON_PUBLIC_KEY=$RUNNER_TEMP/sf-public-key.pem" >> "$GITHUB_ENV"
          echo "BATON_PRIVATE_KEY=$RUNNER_TEMP/sf-private-key.pem" >> "$GITHUB_ENV"
      - name: DEBUG non-secret input facts
        env:
          SF_SUBJECT_NAME_ID: ${{ secrets.SF_SUBJECT_NAME_ID }}
          SF_ISSUER_URL: ${{ secrets.SF_ISSUER_URL }}
        run: |
          openssl x509 -noout -subject -issuer -dates -in "$RUNNER_TEMP/sf-public-key.pem" || true
          a=$(openssl x509 -pubkey -noout -in "$RUNNER_TEMP/sf-public-key.pem" 2>/dev/null | openssl sha256 2>/dev/null | awk '{print $NF}')
          b=$(openssl pkey -pubout -in "$RUNNER_TEMP/sf-private-key.pem" 2>/dev/null | openssl sha256 2>/dev/null | awk '{print $NF}')
          if [ -n "$a" ] && [ "$a" = "$b" ]; then echo "DEBUG key match: yes"; else echo "DEBUG key match: no"; fi
          echo "DEBUG subject name id length: ${#SF_SUBJECT_NAME_ID}"
          case "$SF_SUBJECT_NAME_ID" in ''|*[!0-9]*) echo "DEBUG subject name id all digits: no";; *) echo "DEBUG subject name id all digits: yes";; esac
          echo "DEBUG issuer host: $(printf '%s' "$SF_ISSUER_URL" | sed -E 's#^[a-zA-Z]+://([^/]*).*#\1#')"
      - name: Run baton-successfactors
        run: ./baton-successfactors
      - name: Install baton
        run: ./scripts/get-baton.sh && mv baton /usr/local/bin
      - name: Test baton resources
        env:
          BATON: baton
          BATON_SUCCESSFACTORS: ./baton-successfactors
          BATON_CID: ${{ secrets.SF_SAML_API_KEY }}
          BATON_COMPANY_ID: ${{ secrets.SF_COMPANY_ID }}
          BATON_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          BATON_ISSUER_URL: ${{ secrets.SF_ISSUER_URL }}
          BATON_SAML_API_KEY: ${{ secrets.SF_SAML_API_KEY }}
          BATON_SUBJECT_NAME_ID: ${{ secrets.SF_SUBJECT_NAME_ID }}
          BATON_PRINCIPAL: "rsmith"
        run: ./test/verify-resources.sh
